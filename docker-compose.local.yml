version: '3.8'

services:
  flowproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowproxy:local
    container_name: flowproxy
    ports:
      - "38000:8000"
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./config/setting.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
